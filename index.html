        let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultAppData;

        function saveAppData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        }

        function setRole(role) {
            appData.role = role;
            saveAppData();
            updateRoleUI();
            renderView();
            showToast(`Berhasil beralih ke Mode ${role === 'guru' ? 'Guru (Ibu Salsa)' : 'Siswa'}`, 'success');
        }

        function updateRoleUI() {
            const isGuru = appData.role === 'guru';
            document.getElementById('role-siswa-btn').className = `px-3 py-1.5 text-xs font-bold rounded-xl transition ${!isGuru ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-indigo-600'}`;
            document.getElementById('role-guru-btn').className = `px-3 py-1.5 text-xs font-bold rounded-xl transition ${isGuru ? 'bg-white text-purple-700 shadow-sm' : 'text-slate-600 hover:text-purple-600'}`;
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        function showToast(message, type = 'info') {
            const existing = document.getElementById('toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            let bg = 'bg-slate-800 text-white';
            let icon = 'fa-circle-info text-sky-400';
            if(type === 'success') { bg = 'bg-emerald-600 text-white'; icon = 'fa-circle-check text-emerald-200'; }
            if(type === 'error') { bg = 'bg-rose-600 text-white'; icon = 'fa-circle-exclamation text-rose-200'; }

            toast.id = 'toast-notification';
            toast.className = `fixed bottom-6 right-6 z-50 ${bg} px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-3 transition transform duration-300 translate-y-2 animate-bounce`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="font-medium text-sm">${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function submitQuiz(e, babId) {
            e.preventDefault();
            const sem = babId <= 6 ? 1 : 2;
            const bab = rpsData[sem].find(b => b.id === babId);
            const quizData = bab.kuis;

            let correctCount = 0;
            let userAnswers = {};
            quizData.forEach((q, idx) => {
                const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
                const val = selected ? parseInt(selected.value) : -1;
                userAnswers[idx] = val;
                if(val === q.correct) {
                    correctCount++;
                }
            });

            const score = Math.round((correctCount / quizData.length) * 100);
            appData.quizScores[babId] = { score, passed: score >= 75, answers: userAnswers };
            saveAppData();

            if(score >= 75) {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }

            showToast(`Kuis dinilai otomatis! Nilai Anda: ${score} Poin`, score >= 75 ? 'success' : 'error');
            renderView();
        }

        function resetQuiz(babId) {
            delete appData.quizScores[babId];
            saveAppData();
            renderView();
            showToast('Kuis direset, silakan coba kembali.', 'info');

                                    <option value="universal">Indikator Universal</option>
                                </select>
                            </div>

                            <div class="p-5 bg-indigo-50/50 rounded-2xl border border-indigo-100 space-y-2">
                                <p class="text-xs font-bold text-indigo-900 uppercase">Hasil Pengukuran pH</p>
                                <div id="lab-ph-display" class="text-3xl font-extrabold text-purple-600">pH: 1.0 (Asam Kuat)</div>
                                <p id="lab-desc" class="text-xs text-slate-600">Larutan bersifat asam kuat, mengubah warna indikator menjadi merah pekat.</p>
                            </div>
                        </div>

                        <!-- Visual Beaker Container -->
                        <div class="flex flex-col items-center justify-center space-y-4">
                            <div class="relative w-48 h-60 border-4 border-slate-300 rounded-b-3xl border-t-0 flex flex-col justify-end overflow-hidden shadow-inner bg-slate-50">
                                <div id="beaker-liquid" class="w-full h-3/4 bg-red-500 transition-all duration-500 flex items-center justify-center text-white font-extrabold text-lg drop-shadow-md">
                                    HCl
                                </div>
                            </div>
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Tabung Reaksi Virtual</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function initLabSim() {
            updateLabSim();
        }

        function updateLabSim() {
            const sol = document.getElementById('lab-solution').value;
            const ind = document.getElementById('lab-indicator').value;
            const liquid = document.getElementById('beaker-liquid');
            const phDisplay = document.getElementById('lab-ph-display');
            const desc = document.getElementById('lab-desc');

            if(sol === 'HCl') {
                liquid.style.backgroundColor = '#ef4444'; // Red
                liquid.innerText = 'HCl';
                phDisplay.innerText = 'pH: 1.0 (Asam)';
                desc.innerText = 'Asam kuat menghasilkan ion H+ tinggi. Lakmus merah tetap merah, lakmus biru jadi merah.';
            } else if(sol === 'CH3COOH') {
                liquid.style.backgroundColor = '#f97316'; // Orange
                liquid.innerText = 'CH₃COOH';
                phDisplay.innerText = 'pH: 3.0 (Asam Lemah)';
                desc.innerText = 'Asam lemah terionisasi sebagian. Menunjukkan sifat asam moderat.';
            } else if(sol === 'NaOH') {
                liquid.style.backgroundColor = '#8b5cf6'; // Purple / Blue
                liquid.innerText = 'NaOH';
                phDisplay.innerText = 'pH: 13.0 (Basa)';
                desc.innerText = 'Basa kuat menghasilkan ion OH-. Fenolftalein berubah warna menjadi merah fanta.';
            } else {
                liquid.style.backgroundColor = '#3b82f6'; // Blue
                liquid.innerText = 'H₂O';
                phDisplay.innerText = 'pH: 7.0 (Netral)';
                desc.innerText = 'Air murni bersifat netral, tidak mengubah warna kertas lakmus.';
            }
        }
